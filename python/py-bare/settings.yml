default:
  project_name: py-bare
  project_type: bare
  language: python
  tools:
    quarto: false
    uv: true
  directories: {}
  render_dirs: {}
  author:
    name: ''
    email: ''
    affiliation: ''
  quarto:
    html:
      format: html
      embed_resources: true
      theme: default
      toc: true
      toc_depth: 3
      code_fold: false
      code_tools: false
      highlight_style: github
    revealjs:
      format: revealjs
      theme: default
      incremental: false
      slide_number: true
      transition: slide
      background_transition: fade
      controls: true
      progress: true
      center: true
      highlight_style: github
  git:
    enabled: true
    user_name: ''
    user_email: ''
    hooks:
      data_security: false
  ai:
    enabled: true
    canonical_file: AGENTS.md
    assistants:
    - claude
  scaffold:
    seed_on_scaffold: false
    seed: '123'
    source_all_functions: true
    notebook_format: jupyter
  data: {}
  connections:
    default_database: framework
    databases:
      framework:
        driver: sqlite
        database: framework.db
      study:
        driver: sqlite
        database: ../../shared/study.sqlite
        read_only: true
    storage_buckets: {}
  security:
    sensitive: false
