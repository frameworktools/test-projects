default:
  project_name: r-course
  project_type: course
  tools:
    quarto: true
    renv: false
  author:
    name: Your Name
    email: your.email@example.com
    affiliation: Your Institution
  directories:
    data: data
    slides: slides
    assignments: assignments
    course_docs: course_docs
    readings: readings
    notebooks: modules
    cache: cache
    functions: functions
    scripts: scripts
  extra_directories: ~
  render_dirs:
    slides: rendered/slides
    assignments: rendered/assignments
    course_docs: rendered/course_docs
    modules: rendered/modules
  quarto:
    html:
      format: html
      embed_resources: true
      theme: default
      toc: true
      toc_depth: 3
      code_fold: false
      code_tools: false
      highlight_style: github
    revealjs:
      format: revealjs
      theme: default
      incremental: false
      slide_number: true
      transition: slide
      background_transition: fade
      controls: true
      progress: true
      center: true
      highlight_style: github
    render_dir: rendered/slides
  packages:
    use_renv: false
    default_packages:
    - name: dplyr
      source: cran
      auto_attach: true
    - name: ggplot2
      source: cran
      auto_attach: true
    - name: tidyr
      source: cran
      auto_attach: true
    - name: stringr
      source: cran
      auto_attach: true
    - name: readr
      source: cran
      auto_attach: true
    - name: purrr
      source: cran
      auto_attach: false
    - name: tibble
      source: cran
      auto_attach: true
    - name: forcats
      source: cran
      auto_attach: true
    - name: lubridate
      source: cran
      auto_attach: false
    - name: glue
      source: cran
      auto_attach: false
    - name: here
      source: cran
      auto_attach: false
    - name: lme4
      source: cran
      auto_attach: false
  git:
    enabled: true
    user_name: ''
    user_email: ''
    hooks:
      data_security: false
  ai:
    enabled: true
    canonical_file: AGENTS.md
    assistants:
    - claude
  scaffold:
    seed_on_scaffold: false
    seed: '123'
    set_theme_on_scaffold: true
    ggplot_theme: theme_minimal
    notebook_format: quarto
    workflow: quarto
    positron: false
    source_all_functions: true
  data: []
  connections:
    default_database: framework
    databases:
      framework:
        driver: sqlite
        database: framework.db
      # Shared, read-only study database (path is relative to the project root)
      study:
        driver: sqlite
        database: ../../shared/study.sqlite
        read_only: true
  security:
    sensitive: false
  data_hooks: ~
