default:
  project_name: r-project
  project_type: project
  tools:
    quarto: true
    renv: false
  directories:
    notebooks: notebooks
    scripts: scripts
    functions: functions
    inputs_raw: inputs/raw
    inputs_intermediate: inputs/intermediate
    inputs_final: inputs/final
    docs: docs
    outputs_tables: outputs/tables
    outputs_figures: outputs/figures
    outputs_models: outputs/models
    outputs_reports: outputs/reports
    cache: outputs/cache
    scratch: scratch
    logs: logs
  extra_directories: ~
  render_dirs:
    notebooks: outputs/notebooks
    docs: outputs/docs
  author: settings/author.yml
  packages: settings/packages.yml
  git: settings/git.yml
  ai: settings/ai.yml
  scaffold: settings/scaffold.yml
  connections: settings/connections.yml
  quarto: settings/quarto.yml
  data: settings/data.yml
  security:
    sensitive: false
  data_hooks: ~
  # Publishing destinations for publish(), publish_notebook(), publish_data(),
  # publish_dir(), and publish_list(). local-site is a folder inside the
  # project (gitignored; a relative path starts at the project root), so you
  # can open local-site/index.html in a browser after publishing.
  publish:
    default: local-site
    destinations:
      local-site:
        driver: folder
        path: local-site
      # site-root keeps only the latest publish, at the folder's root, as a
      # GitHub Pages docs/ folder wants. Gitignored like local-site.
      local-deck:
        driver: folder
        path: local-deck
        layout: site-root
